<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build and blend — S · Pazapa Phonics W1L1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-blue-dark:#1B7E92;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;

    --bg:#fffdf7;
    --surface:#ffffff;
    --border:#dcebef;
    --radius:20px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans", Arial, sans-serif;
    background:var(--bg);
    color:var(--pazapa-grey-dark);
    min-height:100vh;
    line-height:1.6;
  }

  h1,h2,.heading{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    text-transform:none;
  }

  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
  }

  .wrap{
    max-width:860px;
    margin:0 auto;
    padding:1.4rem 1.1rem 3rem;
  }

  header{text-align:center; margin-bottom:1.2rem;}
  .logo-badge{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:.4rem .9rem;
    font-size:13px;
    font-weight:700;
    color:var(--pazapa-blue-dark);
    margin-bottom:.6rem;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .logo-badge img{ height:22px; width:auto; display:block; }

  .week-label{
    font-size:.88rem;
    font-weight:700;
    color:var(--pazapa-blue-dark);
    letter-spacing:.04em;
    margin-bottom:.2rem;
  }
  h1{
    font-size:clamp(1.3rem, 4.5vw, 2rem);
    font-weight:900;
    margin:.1rem 0 .5rem;
  }
  .target-tag{
    display:inline-flex;
    align-items:center;
    font-size:.85rem;
    font-weight:700;
    color:var(--pazapa-blue-dark);
    background:#e7f7fb;
    border:1px solid #bfe9f2;
    border-radius:999px;
    padding:.25rem .7rem;
  }

  .leo-fadi-banner{ text-align:center; margin:0 0 1.2rem; }
  .leo-fadi-banner img{
    width:100%;
    max-width:300px;
    height:auto;
    border-radius:16px;
    display:block;
    margin:0 auto;
  }

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--border);
    padding:1.5rem 1.3rem;
    margin-bottom:1.3rem;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
    position:relative;
    overflow:hidden;
  }
  .card-stripe{
    position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg, var(--pazapa-blue), var(--pazapa-blue-dark));
  }
  .card.locked{ opacity:.5; pointer-events:none; }

  .section-title{
    font-size:1.05rem;
    font-weight:800;
    margin:0 0 .3rem;
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .section-sub{ font-size:.9rem; color:#5c6668; margin:0 0 1.1rem; }

  .btn-round{
    width:48px;height:48px;
    min-width:48px;min-height:48px;
    border-radius:50%;
    border:none;
    background:#e7f7fb;
    color:var(--pazapa-blue-dark);
    font-size:1.2rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    transition:transform .12s ease;
  }
  .btn-round:active{ transform:translateY(2px); }
  .btn-round:disabled{ opacity:.4; cursor:default; }
  .btn-round.pulse{ box-shadow:0 0 0 4px var(--pazapa-yellow); }
  .btn-round:focus-visible{ outline:3px solid var(--pazapa-blue); outline-offset:2px; }

  .btn{
    font-family:"Open Sans", Arial, sans-serif;
    font-size:clamp(.88rem, 2.5vw, .97rem);
    font-weight:700;
    border-radius:999px;
    border:none;
    padding:.65rem 1.3rem;
    min-height:2.85rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
  }
  .btn:active{ transform:translateY(2px); }
  .btn-primary{ background:var(--pazapa-blue); color:var(--pazapa-grey-dark); box-shadow:0 4px 0 var(--pazapa-blue-dark); }
  .btn-secondary{ background:#e7f7fb; color:var(--pazapa-blue-dark); border:1px solid #bfe9f2; }
  .btn-yellow{ background:var(--pazapa-yellow); color:var(--pazapa-grey-dark); box-shadow:0 4px 0 #c99900; }
  .btn:disabled{ opacity:.5; cursor:default; }

  /* Activity 1 — picture grid */
  .word-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:.9rem;
  }
  @media (max-width:640px){
    .word-grid{ grid-template-columns:repeat(2, 1fr); }
  }

  .word-card{
    position:relative;
    background:var(--bg);
    border:2px solid var(--border);
    border-radius:16px;
    padding:.7rem .5rem .9rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
    transition:border-color .2s ease;
  }
  .word-card.correct{ border-color:var(--pazapa-green); }
  .word-card.wrong-outline{ border-color:var(--pazapa-blue); }

  .card-select{
    all:unset;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.4rem;
    width:100%;
    cursor:pointer;
  }
  .card-select:focus-visible{
    outline:3px solid var(--pazapa-blue);
    outline-offset:2px;
    border-radius:10px;
  }
  .card-select[disabled]{
    cursor:default;
    opacity:.75;
  }

  .pic-frame{
    position:relative;
    width:100%;
    max-width:170px;
    aspect-ratio:1/1;
    background:#eef8fa;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin:0 auto;
  }
  .pic-frame img{ width:100%; height:100%; object-fit:contain; display:block; }

  .cross-mark{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .cross-mark svg{ width:70%; height:70%; }
  .word-card.crossed .cross-mark{ display:flex; }
  .word-card.crossed.correct .cross-mark line{ stroke:var(--pazapa-green); }

  .card-audio{
    all:unset;
    width:48px;height:48px;
    min-width:48px;min-height:48px;
    border-radius:50%;
    background:var(--pazapa-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.05rem;
    cursor:pointer;
    box-shadow:0 3px 0 var(--pazapa-blue-dark);
  }
  .card-audio:active{ transform:translateY(2px); box-shadow:none; }
  .card-audio:disabled{ background:var(--pazapa-grey-light); color:#9a9a96; box-shadow:none; cursor:default; }
  .card-audio:focus-visible{ outline:3px solid var(--pazapa-blue-dark); outline-offset:2px; }
  .card-audio.clue-highlight{ outline:3px solid var(--pazapa-yellow); outline-offset:2px; }

  .find-feedback{
    text-align:center;
    font-size:clamp(.9rem, 2.5vw, 1rem);
    font-weight:700;
    margin-top:1.1rem;
    min-height:1.4rem;
    opacity:0;
    transition:opacity .3s ease;
  }
  .find-feedback.show{ opacity:1; }
  .find-feedback.almost{ color:var(--pazapa-blue-dark); }
  .find-feedback.success{ color:#5c7a12; }

  .activity-done-badge{
    display:none;
    align-items:center;
    gap:.4rem;
    font-size:.8rem;
    font-weight:800;
    color:#5c7a12;
    background:#f2f8e3;
    border:1px solid #d8e6b0;
    border-radius:999px;
    padding:.25rem .7rem;
    margin-left:auto;
  }
  .activity-done-badge.show{ display:inline-flex; }

  /* Activity 2 — trace */
  .trace-instruction{
    text-align:center;
    font-size:clamp(1rem, 3vw, 1.15rem);
    font-weight:700;
    margin-bottom:1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6rem;
  }
  .canvas-wrap{
    position:relative;
    width:100%;
    max-width:320px;
    aspect-ratio:1/1;
    margin:0 auto;
    background:#eef8fa;
    border:2px solid #bfe9f2;
    border-radius:18px;
    overflow:hidden;
    touch-action:none;
  }
  .canvas-wrap img.guide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:.35;
    pointer-events:none;
  }
  #traceCanvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }
  .show-me-overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.92);
    border-radius:16px;
  }
  .show-me-overlay.show{ display:flex; }
  .show-me-overlay img{ width:80%; height:auto; }

  .trace-controls{
    display:flex;
    justify-content:center;
    gap:.7rem;
    flex-wrap:wrap;
    margin-top:1.1rem;
  }
  .trace-feedback{
    text-align:center;
    font-size:clamp(.9rem, 2.5vw, 1rem);
    font-weight:700;
    color:var(--pazapa-blue-dark);
    margin-top:.9rem;
    min-height:1.4rem;
    opacity:0;
    transition:opacity .3s ease;
  }
  .trace-feedback.show{ opacity:1; }

  /* completion */
  .completion-card{ text-align:center; display:none; }
  .completion-card.show{ display:block; }
  .completion-icon{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--pazapa-green);
    color:var(--pazapa-grey-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:900;
    margin:0 auto .6rem;
  }
  .completion-card h2{
    font-size:clamp(1.2rem, 4vw, 1.6rem);
    font-weight:900;
    margin:.2rem 0 .3rem;
  }
  .completion-card p{ font-size:.98rem; color:#5c6668; margin:0 0 1.1rem; }

  footer{
    text-align:center;
    margin-top:1.6rem;
    font-size:.72rem;
    color:#8a8a86;
    opacity:.8;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="logo-badge" id="logoBadge"></div>
    <div class="week-label">Week 1 · Lesson 1</div>
    <h1>Build and blend</h1>
    <span class="target-tag">/s/</span>
  </header>

  <div class="leo-fadi-banner">
    <img id="leoFadiImg" alt="Leo and Fadi">
  </div>

  <!-- ACTIVITY 1 — FIND /s/ -->
  <section class="card" id="partFind">
    <div class="card-stripe"></div>
    <div class="section-title">
      <button class="btn-round" id="playFindInstruction" aria-label="Play instruction">🔊</button>
      Find /s/
      <span class="activity-done-badge" id="findDoneBadge">✓ Done</span>
    </div>
    <p class="section-sub">Listen. Which picture does not have /s/?</p>

    <div class="word-grid" id="findGrid"></div>

    <div class="find-feedback" id="findFeedback"></div>

    <div class="find-controls" id="findControls" style="display:none; justify-content:center; margin-top:.9rem;">
      <button class="btn btn-yellow" id="clueBtn">Give me a clue</button>
    </div>
  </section>

  <!-- ACTIVITY 2 — TRACE THE LETTER -->
  <section class="card" id="partTrace">
    <div class="card-stripe"></div>
    <div class="section-title">
      <button class="btn-round" id="playTraceInstruction" aria-label="Play instruction">🔊</button>
      Trace the letter
      <span class="activity-done-badge" id="traceDoneBadge">✓ Done</span>
    </div>
    <p class="section-sub">Trace S.</p>

    <div class="canvas-wrap" id="canvasWrap">
      <img class="guide" id="traceGuideImg" alt="">
      <canvas id="traceCanvas"></canvas>
      <div class="show-me-overlay" id="showMeOverlay">
        <img id="showMeImg" alt="Hand tracing the letter S">
      </div>
    </div>

    <div class="trace-controls">
      <button class="btn btn-secondary" id="showMeBtn">Show me</button>
      <button class="btn btn-secondary" id="tryAgainTraceBtn">Try again</button>
    </div>

    <div class="trace-feedback" id="traceFeedback"></div>
  </section>

  <!-- Completion -->
  <section class="card completion-card" id="completionCard">
    <div class="card-stripe"></div>
    <div class="completion-icon">✓</div>
    <h2>Well done!</h2>
    <p>You found /s/ and traced S.</p>
    <button class="btn btn-primary" id="doneBtn" disabled>Done</button>
  </section>

  <footer>Source: Leo &amp; Fadi — Age 3–5 Workbook, p.3 · Pazapa Phonics W1L1</footer>

</div>

  // Official model-pronunciation recordings for the four source
  // pictures. Word order and content follow the exact Workbook
  // exercise — not invented.
  const AUDIO_SNAKE = "";
  const AUDIO_SALAT = "";
  const AUDIO_SUN = "";
  const AUDIO_BOY_CHAIR = "";

  // Isolated phoneme /s/ — used only as a second-attempt clue.
  // Never generated with SpeechSynthesis.
  const AUDIO_SOUND_S = "";

  // Interface instruction slots only (not pedagogical content).
  const AUDIO_FIND_INSTRUCTION = "";
  const AUDIO_TRACE_INSTRUCTION = "";

  /* ============================================================
     2. CENTRAL MEDIA MANAGER — one audio source at a time.
     ============================================================ */
  let currentAudio = null;

  function stopAllMedia(){
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }

  // Interface instructions only — official file first, en-GB
  // SpeechSynthesis as a development fallback. Never used for
  // vocabulary words or the isolated phoneme /s/.
  function playInstruction(officialSrc, fallbackText){
    stopAllMedia();
    if(officialSrc){
      currentAudio = new Audio(officialSrc);
      currentAudio.play().catch(()=>{ speakFallback(fallbackText); });
      return;
    }
    speakFallback(fallbackText);
  }

  function speakFallback(text){
    if(!text) return;
    if(!('speechSynthesis' in window)){
      console.warn("SpeechSynthesis not available for fallback audio.");
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-GB";
    utterance.rate = 0.92;
    window.speechSynthesis.speak(utterance);
  }

  // Official recordings only. No SpeechSynthesis is ever used for
  // vocabulary words or the isolated phoneme /s/.
  function playOfficial(src){
    if(!src) return;
    stopAllMedia();
    currentAudio = new Audio(src);
    currentAudio.play().catch(()=>{
      console.warn("Official audio failed to play:", src);
    });
  }

  /* ============================================================
     3. LOGO — official image only; plain text fallback.
     ============================================================ */
  (function renderLogo(){
    const badge = document.getElementById("logoBadge");
    if(IMAGE_PAZAPA_LOGO){
      const img = document.createElement("img");
      img.src = IMAGE_PAZAPA_LOGO;
      img.alt = "Pazapa Phonics";
      badge.appendChild(img);
    } else {
      badge.textContent = "Pazapa Phonics · Level 1";
    }
  })();

  /* ============================================================
     4. LEO & FADI BANNER
     ============================================================ */
  (function renderLeoFadi(){
    const img = document.getElementById("leoFadiImg");
    if(IMAGE_LEO_FADI){
      img.src = IMAGE_LEO_FADI;
    } else {
      img.remove();
    }
  })();

  document.getElementById("playFindInstruction").addEventListener("click", ()=>{
    playInstruction(AUDIO_FIND_INSTRUCTION, "Listen. Which picture does not have the s sound?");
  });
  document.getElementById("playTraceInstruction").addEventListener("click", ()=>{
    playInstruction(AUDIO_TRACE_INSTRUCTION, "Trace the letter S.");
  });

  /* ============================================================
     5. ACTIVITY 1 — FIND /s/
     Source exercise: Snake, Salat, Sun (have /s/) and the boy
     getting off the chair (does not have /s/) — Workbook p.3.
     ============================================================ */
  const FIND_ITEMS = [
    { id:"snake", img:IMAGE_SNAKE, audio:AUDIO_SNAKE, hasTargetSound:true },
    { id:"salat", img:IMAGE_SALAT, audio:AUDIO_SALAT, hasTargetSound:true },
    { id:"sun",   img:IMAGE_SUN,   audio:AUDIO_SUN,   hasTargetSound:true },
    { id:"boy",   img:IMAGE_BOY_CHAIR, audio:AUDIO_BOY_CHAIR, hasTargetSound:false }
  ];

  const findGrid = document.getElementById("findGrid");
  const findFeedback = document.getElementById("findFeedback");
  const findDoneBadge = document.getElementById("findDoneBadge");
  const findControls = document.getElementById("findControls");
  const clueBtn = document.getElementById("clueBtn");
  const partFindEl = document.getElementById("partFind");

  let findAttempts = 0;
  let activity1Complete = false;
  const findSelectButtons = [];

  FIND_ITEMS.forEach(item=>{
    const card = document.createElement("div");
    card.className = "word-card";
    card.id = "find-" + item.id;

    const selectBtn = document.createElement("button");
    selectBtn.className = "card-select";
    selectBtn.type = "button";
    selectBtn.setAttribute("aria-label", "Choose this picture");
    findSelectButtons.push(selectBtn);

    const frame = document.createElement("div");
    frame.className = "pic-frame";
    const img = document.createElement("img");
    img.src = item.img;
    img.alt = "";
    frame.appendChild(img);

    const cross = document.createElement("div");
    cross.className = "cross-mark";
    cross.innerHTML = '<svg viewBox="0 0 100 100"><line x1="15" y1="15" x2="85" y2="85" stroke-width="10" stroke-linecap="round"/><line x1="85" y1="15" x2="15" y2="85" stroke-width="10" stroke-linecap="round"/></svg>';
    frame.appendChild(cross);

    selectBtn.appendChild(frame);

    const audioBtn = document.createElement("button");
    audioBtn.className = "card-audio";
    audioBtn.type = "button";
    audioBtn.innerHTML = "🔊";
    audioBtn.setAttribute("aria-label", "Listen");
    audioBtn.disabled = !item.audio;

    card.appendChild(selectBtn);
    card.appendChild(audioBtn);
    findGrid.appendChild(card);

    selectBtn.addEventListener("click", ()=>{
      if(activity1Complete || selectBtn.disabled) return;
      handleFindAttempt(item, card);
    });

    audioBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(audioBtn.disabled) return;
      playOfficial(item.audio);
    });
  });

  function handleFindAttempt(item, card){
    findAttempts++;

    if(item.hasTargetSound === false){
      // Correct: the cross-out is the digital adaptation of the
      // Workbook action, kept permanently on the right picture.
      card.classList.add("crossed", "correct");
      activity1Complete = true;
      findFeedback.textContent = "Well done! This one does not have /s/.";
      findFeedback.className = "find-feedback show success";
      findDoneBadge.classList.add("show");

      // Disable picture selection only — audio stays usable.
      findSelectButtons.forEach(btn=>{
        btn.disabled = true;
        btn.setAttribute("aria-disabled", "true");
      });
      findControls.style.display = "none";

      updateCompletion();
      return;
    }

    // Incorrect: no permanent cross, no shake — a brief calm blue
    // outline, then back to normal. The task stays solvable.
    card.classList.add("wrong-outline");
    setTimeout(()=>{
      card.classList.remove("wrong-outline");
    }, 700);

    if(findAttempts === 1){
      findFeedback.textContent = "Almost — listen again.";
      findFeedback.className = "find-feedback show almost";
    } else {
      findFeedback.textContent = "Listen again.";
      findFeedback.className = "find-feedback show almost";
      findControls.style.display = "flex";
    }
  }

  clueBtn.addEventListener("click", ()=>{
    if(AUDIO_SOUND_S){
      playOfficial(AUDIO_SOUND_S);
      findFeedback.textContent = "Listen for /s/.";
    } else {
      findFeedback.textContent = "Listen to the words again.";
      document.querySelectorAll("#findGrid .card-audio").forEach(btn=>{
        if(!btn.disabled){
          btn.classList.add("clue-highlight");
          setTimeout(()=> btn.classList.remove("clue-highlight"), 1600);
        }
      });
    }
    findFeedback.className = "find-feedback show almost";
  });

     source Workbook p.3 artwork — no invented S shape or path.
     ============================================================ */
  document.getElementById("traceGuideImg").src = IMAGE_LETTER_S_MODEL;
  document.getElementById("showMeImg").src = IMAGE_HAND_S_GUIDE;

  const canvas = document.getElementById("traceCanvas");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");
  const showMeBtn = document.getElementById("showMeBtn");
  const showMeOverlay = document.getElementById("showMeOverlay");
  const tryAgainTraceBtn = document.getElementById("tryAgainTraceBtn");
  const traceFeedback = document.getElementById("traceFeedback");
  const traceDoneBadge = document.getElementById("traceDoneBadge");

  let hasDrawn = false;
  let isDrawing = false;
  let activity2Complete = false;
  let traceDistance = 0;
  let lastTracePoint = null;
  let requiredTraceDistance = 0;
  let canvasRectWidth = 0;
  let canvasRectHeight = 0;

  // Broad tolerant zones matched to the real source S guide
  // (upper loop opens top-right, diagonal crosses the centre,
  // lower loop opens bottom-left). Coverage of all three vertical
  // bands AND both horizontal sides is required — together with a
  // minimum distance — so that neither a half-S, a straight line,
  // nor an isolated scribble can validate the activity.
  let traceZones = { top:false, middle:false, bottom:false };
  let traceSides = { left:false, right:false };

  function resetTraceCoverage(){
    traceZones = { top:false, middle:false, bottom:false };
    traceSides = { left:false, right:false };
  }

  function registerTraceZone(y, height){
    const ratio = y / height;
    if(ratio < 0.38){
      traceZones.top = true;
    } else if(ratio < 0.68){
      traceZones.middle = true;
    } else {
      traceZones.bottom = true;
    }
  }

  function registerTraceSide(x, width){
    const ratio = x / width;
    if(ratio < 0.45){
      traceSides.left = true;
    }
    if(ratio > 0.55){
      traceSides.right = true;
    }
  }

  function resizeCanvas(){
    const rect = canvasWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    // Threshold and zones are relative to the drawing area, not
    // raw canvas pixels, so they stay fair across screen sizes.
    canvasRectWidth = rect.width;
    canvasRectHeight = rect.height;
    requiredTraceDistance = rect.width * 1.5;
    // A resize must never silently mark the activity done, and
    // old zone/side coverage must never survive a resize — strokes
    // are cleared and the attempt restarts cleanly.
    resetTraceAttempt();
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDraw(e){
    isDrawing = true;
    const p = getPos(e);
    lastTracePoint = p;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  function moveDraw(e){
    if(!isDrawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = "#1B7E92";
    ctx.lineWidth = 12;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();

    if(lastTracePoint){
      const dx = p.x - lastTracePoint.x;
      const dy = p.y - lastTracePoint.y;
      traceDistance += Math.sqrt(dx*dx + dy*dy);
    }
    lastTracePoint = p;
    hasDrawn = true;

    registerTraceZone(p.y, canvasRectHeight);
    registerTraceSide(p.x, canvasRectWidth);

    const enoughDistance = traceDistance >= requiredTraceDistance;
    const enoughCoverage =
      traceZones.top && traceZones.middle && traceZones.bottom &&
      traceSides.left && traceSides.right;

    if(enoughDistance && enoughCoverage && !activity2Complete){
      activity2Complete = true;
      traceDoneBadge.classList.add("show");
      traceFeedback.textContent = "Great tracing!";
      traceFeedback.classList.add("show");
      updateCompletion();
    }
  }
  function endDraw(){
    isDrawing = false;
    lastTracePoint = null;
  }

  canvas.addEventListener("pointerdown", startDraw);
  canvas.addEventListener("pointermove", moveDraw);
  window.addEventListener("pointerup", endDraw);
  window.addEventListener("pointercancel", endDraw);
  canvas.style.touchAction = "none";

  function clearCanvasStrokes(){
    const rect = canvasWrap.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
  }

  // Full reset of Activity 2 only — Activity 1 is untouched.
  // Used by Try again, and by any resize.
  function resetTraceAttempt(){
    clearCanvasStrokes();
    hasDrawn = false;
    isDrawing = false;
    traceDistance = 0;
    lastTracePoint = null;
    resetTraceCoverage();
    const wasComplete = activity2Complete;
    activity2Complete = false;
    traceDoneBadge.classList.remove("show");
    traceFeedback.classList.remove("show");
    traceFeedback.textContent = "";
    if(wasComplete){
      updateCompletion();
    }
  }

  tryAgainTraceBtn.addEventListener("click", ()=>{
    showMeOverlay.classList.remove("show");
    if(showMeTimer){
      clearTimeout(showMeTimer);
      showMeTimer = null;
    }
    resetTraceAttempt();
    traceFeedback.textContent = "Try tracing S again.";
    traceFeedback.classList.add("show");
  });

  // Viewing the demonstration is never counted as tracing: it
  // does not touch traceDistance, hasDrawn or activity2Complete.
  let showMeTimer = null;
  showMeBtn.addEventListener("click", ()=>{
    showMeOverlay.classList.add("show");
    if(showMeTimer) clearTimeout(showMeTimer);
    showMeTimer = setTimeout(()=>{
      showMeOverlay.classList.remove("show");
      showMeTimer = null;
    }, 2600);
  });
  showMeOverlay.addEventListener("click", ()=>{
    showMeOverlay.classList.remove("show");
    if(showMeTimer){
      clearTimeout(showMeTimer);
      showMeTimer = null;
    }
  });

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("load", resizeCanvas);
  setTimeout(resizeCanvas, 50);

  /* ============================================================
     7. COMPLETION — requires both activities meaningfully done.
     ============================================================ */
  const completionCard = document.getElementById("completionCard");
  const doneBtn = document.getElementById("doneBtn");

  function updateCompletion(){
    const complete = activity1Complete && activity2Complete;
    completionCard.classList.toggle("show", complete);
    doneBtn.disabled = !complete;
  }

  let completionSent = false;

  function activityCompleted(){
    if(completionSent) return;
    completionSent = true;
    console.log("W1L1 Build and blend completed");
  }

  doneBtn.addEventListener("click", ()=>{
    if(doneBtn.disabled) return;
    stopAllMedia();
    activityCompleted();
    doneBtn.textContent = "Done ✓";
    doneBtn.disabled = true;
  });

})();
</script>
</body>
</html>
