<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — S · Pazapa Phonics W1L1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-blue-dark:#1B7E92;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;

    --bg:#fffdf7;
    --surface:#ffffff;
    --border:#dcebef;
    --radius:20px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans", Arial, sans-serif;
    background:var(--bg);
    color:var(--pazapa-grey-dark);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    line-height:1.6;
  }

  h1,h2,.heading{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    text-transform:none;
  }

  /* fixed decorative bubbles — static, official palette only */
  .bubble{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:.3;
    z-index:0;
    pointer-events:none;
  }
  .bubble-yellow{width:220px;height:220px;background:var(--pazapa-yellow);top:-70px;right:-60px;}
  .bubble-blue{width:260px;height:260px;background:var(--pazapa-blue);bottom:-90px;left:-80px;}
  .bubble-green{width:150px;height:150px;background:var(--pazapa-green);top:40%;right:-70px;}
  .bubble-grey{width:140px;height:140px;background:var(--pazapa-grey-light);top:15%;left:-60px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:820px;
    margin:0 auto;
    padding:1.4rem 1.1rem 3rem;
  }

  header{text-align:center; margin-bottom:1.6rem;}
  .logo-badge{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:.4rem .9rem;
    font-family:"Open Sans", Arial, sans-serif;
    font-size:13px;
    color:var(--pazapa-blue-dark);
    margin-bottom:.6rem;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .logo-badge img{
    height:22px;
    width:auto;
    display:block;
  }

  .week-label{
    font-size:.88rem;
    font-weight:700;
    color:var(--pazapa-blue-dark);
    letter-spacing:.04em;
    margin-bottom:.2rem;
  }
  h1{
    font-size:clamp(1.3rem, 4.5vw, 2rem);
    font-weight:900;
    margin:.1rem 0 .6rem;
    color:var(--pazapa-grey-dark);
  }

  .cue{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    justify-content:center;
    font-size:clamp(1rem, 3vw, 1.15rem);
    font-weight:700;
    color:var(--pazapa-blue-dark);
  }

  .instr-audio{
    width:48px;height:48px;
    min-width:48px;
    min-height:48px;
    border-radius:50%;
    border:none;
    background:#e7f7fb;
    color:var(--pazapa-blue-dark);
    font-size:1.1rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .instr-audio:focus-visible{outline:3px solid var(--pazapa-blue); outline-offset:2px;}

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--border);
    padding:1.5rem 1.3rem;
    margin-bottom:1.3rem;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
    position:relative;
    overflow:hidden;
    opacity:0;
    animation:fadeUp .5s ease forwards;
  }
  .card-stripe{
    position:absolute;
    top:0;left:0;right:0;
    height:8px;
    background:linear-gradient(90deg, var(--pazapa-blue), var(--pazapa-blue-dark));
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .section-title{
    font-size:1.05rem;
    font-weight:800;
    color:var(--pazapa-grey-dark);
    margin:0 0 .3rem;
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .section-sub{
    font-size:.9rem;
    color:#5c6668;
    margin:0 0 1rem;
  }
  .target-tag{
    display:inline-flex;
    align-items:center;
    font-family:"Open Sans", Arial, sans-serif;
    font-size:.78rem;
    font-weight:700;
    color:var(--pazapa-blue-dark);
    background:#e7f7fb;
    border:1px solid #bfe9f2;
    border-radius:999px;
    padding:.2rem .6rem;
    margin-left:.3rem;
  }

  /* media frame */
  .media-frame{
    position:relative;
    width:100%;
    max-width:560px;
    aspect-ratio:16/9;
    margin:0 auto 1rem;
    background:#f2fbfd;
    border:2px solid #cdeef5;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .media-frame video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .media-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
    color:var(--pazapa-blue-dark);
    padding:1rem;
    text-align:center;
  }
  .media-placeholder .icon{
    width:56px;height:56px;
    border-radius:50%;
    background:#d8f1f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    color:var(--pazapa-blue-dark);
  }
  .media-placeholder .dev-label{
    font-family:"Open Sans", Arial, sans-serif;
    font-size:.72rem;
    letter-spacing:.03em;
    color:#5c6668;
  }

  .media-controls{
    display:flex;
    justify-content:center;
    gap:.7rem;
    flex-wrap:wrap;
  }

  .btn{
    font-family:"Open Sans", Arial, sans-serif;
    font-size:clamp(.88rem, 2.5vw, .97rem);
    font-weight:700;
    border-radius:999px;
    border:none;
    padding:.65rem 1.3rem;
    min-height:2.75rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    transition:transform .12s ease, opacity .2s ease;
  }
  .btn:active{transform:translateY(2px);}
  .btn-primary{
    background:var(--pazapa-blue);
    color:var(--pazapa-grey-dark);
    box-shadow:0 4px 0 var(--pazapa-blue-dark);
  }
  .btn-secondary{
    background:#e7f7fb;
    color:var(--pazapa-blue-dark);
    border:1px solid #bfe9f2;
  }
  .btn:disabled{
    opacity:.55;
    cursor:default;
  }
  .btn[disabled]:active{transform:none;}

  /* completion */
  .completion-card{
    text-align:center;
    display:none;
  }
  .completion-card.show{
    display:block;
  }
  .completion-icon{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--pazapa-green);
    color:var(--pazapa-grey-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:900;
    margin:0 auto .6rem;
  }
  .completion-card h2{
    font-size:clamp(1.2rem, 4vw, 1.6rem);
    font-weight:900;
    margin:.2rem 0 .3rem;
    color:var(--pazapa-grey-dark);
  }
  .completion-card p{
    font-size:.98rem;
    color:#5c6668;
    margin:0 0 1.1rem;
  }

  footer{
    text-align:center;
    margin-top:1.6rem;
    font-family:"Open Sans", Arial, sans-serif;
    font-size:.7rem;
    color:#8a8a86;
    opacity:.8;
  }

  @media (max-width:480px){
    .media-frame{border-radius:12px;}
  }
</style>
</head>
<body>

<div class="bubble bubble-yellow"></div>
<div class="bubble bubble-blue"></div>
<div class="bubble bubble-green"></div>
<div class="bubble bubble-grey"></div>

<div class="wrap">

  <header>
    <div class="logo-badge" id="logoBadge"></div>
    <div class="week-label">Week 1 · Lesson 1</div>
    <h1>Discover</h1>
    <div class="cue">
      <button class="instr-audio" id="playDiscoverInstruction" aria-label="Play instruction">🔊</button>
      <span>Listen carefully!</span>
    </div>
  </header>

  <!-- PART 1: Meet Leo & Fadi -->
  <section class="card" id="partMeet" style="animation-delay:.05s">
    <div class="card-stripe"></div>
    <div class="section-title">
      <button class="instr-audio" id="playMeetInstruction" aria-label="Play instruction">🔊</button>
      Meet Leo &amp; Fadi
    </div>
    <p class="section-sub">Classbook p.10</p>

    <div class="media-frame" id="meetFrame"></div>

    <div class="media-controls">
      <button class="btn btn-secondary" id="meetReplayBtn">Play it again</button>
    </div>
  </section>

  <!-- PART 2: Listen to the sound -->
  <section class="card" id="partListen" style="animation-delay:.1s">
    <div class="card-stripe"></div>
    <div class="section-title">
      <button class="instr-audio" id="playListenInstruction" aria-label="Play instruction">🔊</button>
      Listen to the sound
      <span class="target-tag">/s/</span>
    </div>
    <p class="section-sub">Animated sound video</p>

    <div class="media-frame" id="soundFrame"></div>

    <div class="media-controls">
      <button class="btn btn-secondary" id="soundReplayBtn">Play it again</button>
    </div>
  </section>

  <!-- Completion -->
  <section class="card completion-card" id="completionCard" style="animation-delay:.15s">
    <div class="card-stripe"></div>
    <div class="completion-icon">✓</div>
    <h2>Well done!</h2>
    <p>You met Leo &amp; Fadi and listened to /s/.</p>
    <button class="btn btn-primary" id="doneBtn" disabled>Done</button>
  </section>

  <footer>Source: Leo &amp; Fadi — Classbook p.10 · Pazapa Phonics W1L1</footer>

</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     1. OFFICIAL MEDIA ASSETS — replaceable slots
     ============================================================ */
  const VIDEO_LEO_FADI_INTRO = "";
  const VIDEO_SOUND_S = "";

  // Official Pazapa logo — image only. No homemade badge is ever used.
  const IMAGE_PAZAPA_LOGO = "";

  // Instruction-audio slots only (interface cues, not pedagogical content).
  const AUDIO_DISCOVER_INSTRUCTION = "";
  const AUDIO_MEET_LEO_FADI = "";
  const AUDIO_LISTEN_SOUND = "";

  // Tracks whether the learner has started each required video.
  const progress = {
      leoFadiVideo: false,
      soundVideo: false
  };

  let currentAudio = null;

  // Central media manager — ensures only one audio/video source is
  // ever heard at a time. Pass the video that should keep playing
  // (if any) as `exceptVideo`.
  function stopAllMedia(exceptVideo = null){
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
    document.querySelectorAll("video").forEach(video => {
      if(video !== exceptVideo){
        video.pause();
      }
    });
  }

  // Interface instructions only — official file first, en-GB
  // SpeechSynthesis as a development fallback. Never used for the
  // isolated phoneme /s/ itself.
  function playInstruction(officialSrc, fallbackText){
    stopAllMedia();
    if(officialSrc){
      currentAudio = new Audio(officialSrc);
      currentAudio.play().catch(()=>{ speakFallback(fallbackText); });
      return;
    }
    speakFallback(fallbackText);
  }

  function speakFallback(text){
    if(!text) return;
    if(!('speechSynthesis' in window)){
      console.warn("SpeechSynthesis not available for fallback audio.");
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-GB";
    utterance.rate = 0.92;
    window.speechSynthesis.speak(utterance);
  }

  document.getElementById("playDiscoverInstruction").addEventListener("click", ()=>{
    playInstruction(AUDIO_DISCOVER_INSTRUCTION, "Listen carefully!");
  });
  document.getElementById("playMeetInstruction").addEventListener("click", ()=>{
    playInstruction(AUDIO_MEET_LEO_FADI, "Meet Leo and Fadi.");
  });
  document.getElementById("playListenInstruction").addEventListener("click", ()=>{
    playInstruction(AUDIO_LISTEN_SOUND, "Listen to the sound.");
  });

  /* ============================================================
     LOGO — official image only; plain text fallback, never a
     homemade pseudo-logo.
     ============================================================ */
  (function renderLogo(){
    const badge = document.getElementById("logoBadge");
    if(IMAGE_PAZAPA_LOGO){
      const img = document.createElement("img");
      img.src = IMAGE_PAZAPA_LOGO;
      img.alt = "Pazapa Phonics";
      badge.appendChild(img);
    } else {
      badge.textContent = "Pazapa Phonics · Level 1";
    }
  })();

  /* ============================================================
     2. VIDEO RENDERING — never a broken <video> on empty source
     ============================================================ */
  function renderVideo(containerId, source, devLabel, iconText){
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    if(source){
      const video = document.createElement("video");
      video.src = source;
      video.controls = true;
      video.playsInline = true;
      video.setAttribute("preload", "metadata");
      container.appendChild(video);
      return video;
    }

    // Neutral development placeholder — no video, no invented content.
    const placeholder = document.createElement("div");
    placeholder.className = "media-placeholder";
    placeholder.innerHTML =
      '<div class="icon">' + iconText + '</div>' +
      '<div class="dev-label">' + devLabel + '</div>';
    container.appendChild(placeholder);
    return null;
  }

  const meetVideo = renderVideo("meetFrame", VIDEO_LEO_FADI_INTRO, "LEO &amp; FADI INTRODUCTION VIDEO", "▶");
  const soundVideo = renderVideo("soundFrame", VIDEO_SOUND_S, "ANIMATED SOUND VIDEO — /s/", "▶");

  const meetReplayBtn = document.getElementById("meetReplayBtn");
  const soundReplayBtn = document.getElementById("soundReplayBtn");

  // Replay buttons only work when a real video exists — never a
  // button that looks functional but does nothing.
  meetReplayBtn.disabled = !VIDEO_LEO_FADI_INTRO;
  soundReplayBtn.disabled = !VIDEO_SOUND_S;

  if(meetVideo){
    meetVideo.addEventListener("play", ()=>{
      stopAllMedia(meetVideo);
      progress.leoFadiVideo = true;
      updateCompletion();
    });
  }
  if(soundVideo){
    soundVideo.addEventListener("play", ()=>{
      stopAllMedia(soundVideo);
      progress.soundVideo = true;
      updateCompletion();
    });
  }

  meetReplayBtn.addEventListener("click", ()=>{
    if(meetReplayBtn.disabled) return;
    const v = document.querySelector("#meetFrame video");
    if(v){
      stopAllMedia(v);
      v.currentTime = 0;
      v.play().catch(()=>{ console.warn("Leo & Fadi video failed to replay."); });
    }
  });

  soundReplayBtn.addEventListener("click", ()=>{
    if(soundReplayBtn.disabled) return;
    const v = document.querySelector("#soundFrame video");
    if(v){
      stopAllMedia(v);
      v.currentTime = 0;
      v.play().catch(()=>{ console.warn("Sound video failed to replay."); });
    }
  });

  /* ============================================================
     3. COMPLETION — only revealed once both videos have started
     ============================================================ */
  const completionCard = document.getElementById("completionCard");
  const doneBtn = document.getElementById("doneBtn");

  function updateCompletion(){
    const complete = progress.leoFadiVideo && progress.soundVideo;
    completionCard.classList.toggle("show", complete);
    doneBtn.disabled = !complete;
  }

  /* ============================================================
     4. MOODLE COMPLETION HOOK — fires once, only on Done
     ============================================================ */
  let completionSent = false;

  function activityCompleted(){
    if(completionSent) return;
    completionSent = true;
    console.log("W1L1 Discover completed");
  }

  doneBtn.addEventListener("click", ()=>{
    if(doneBtn.disabled) return;
    stopAllMedia();
    activityCompleted();
    doneBtn.textContent = "Done ✓";
    doneBtn.disabled = true;
  });

})();
</script>
</body>
</html>
