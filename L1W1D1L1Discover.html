<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Discover the Sound</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  color:var(--pazapa-grey-dark);
  background:#FFFFFF;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 48px;}
header.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  border-bottom:4px solid var(--pazapa-blue);
  padding-bottom:10px;margin-bottom:20px;
}
.brand{font-size:1.15rem;font-weight:700;color:var(--pazapa-blue-dark);}
.brand img{max-height:52px;width:auto;display:block;}
h1{font-size:1.5rem;margin:0;color:var(--pazapa-grey-dark);}
.lesson-tag{font-size:.95rem;color:var(--pazapa-blue-dark);font-weight:600;margin:2px 0 0;}
section.step{
  display:none;background:#FFFFFF;
  border:3px solid var(--pazapa-grey-light);
  border-radius:var(--radius);padding:22px 18px;
}
section.step.is-visible{display:block;}
section.step:focus{outline:4px solid var(--pazapa-blue-dark);outline-offset:3px;}
.step h2{font-size:1.7rem;margin:0 0 6px;text-align:center;}
.step p.lead{font-size:1.25rem;text-align:center;margin:0 0 18px;}
.sound-tag{font-weight:700;color:var(--pazapa-blue-dark);}
button{
  font-family:"Open Sans",Arial,sans-serif;font-size:1.05rem;
  min-height:48px;min-width:48px;border-radius:14px;
  border:3px solid transparent;cursor:pointer;padding:10px 22px;
}
button:focus-visible{outline:4px solid var(--pazapa-grey-dark);outline-offset:3px;}
button[disabled]{opacity:.45;cursor:not-allowed;}
.btn-main{background:var(--pazapa-blue);border-color:var(--pazapa-blue-dark);color:#FFFFFF;font-weight:700;}
.btn-main:not([disabled]):hover{background:var(--pazapa-blue-dark);}
.btn-help{background:var(--pazapa-yellow);border-color:#C89703;color:var(--pazapa-grey-dark);font-weight:700;}
.btn-done{background:var(--pazapa-green);border-color:#96A122;color:var(--pazapa-grey-dark);font-weight:700;font-size:1.2rem;padding:12px 34px;}
.btn-quiet{background:#FFFFFF;border-color:var(--pazapa-blue-dark);color:var(--pazapa-blue-dark);font-weight:700;}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
.helpline{display:flex;justify-content:center;margin-bottom:14px;}
.big-sound{
  display:block;margin:0 auto;width:190px;height:190px;border-radius:50%;
  background:var(--pazapa-blue);border:5px solid var(--pazapa-blue-dark);
  color:#FFFFFF;font-size:2.4rem;font-weight:700;
  font-family:"Filson Soft","Open Sans",Arial,sans-serif;
}
.big-sound[disabled]{background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);border-color:#B9B9B9;}
.characters{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.character{width:200px;text-align:center;}
.character-art{
  height:250px;display:flex;align-items:flex-end;justify-content:center;
  background:#F4FBFD;border:3px solid var(--pazapa-blue);
  border-radius:var(--radius);padding:10px;
}
.character-art img{max-height:100%;max-width:100%;width:auto;object-fit:contain;}
.character .name{
  font-family:"Filson Soft","Open Sans",Arial,sans-serif;
  font-size:1.2rem;font-weight:700;color:var(--pazapa-blue-dark);margin-top:8px;
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
.card{border:3px solid var(--pazapa-grey-light);border-radius:var(--radius);padding:12px;text-align:center;background:#FFFFFF;}
.card .pic{
  height:150px;display:flex;align-items:center;justify-content:center;
  background:#F4FBFD;border-radius:12px;padding:8px;
}
.card .pic img{max-height:100%;max-width:100%;object-fit:contain;}
.card .word{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-size:1.35rem;font-weight:700;margin:10px 0;}
.card .speaker{
  background:var(--pazapa-blue);border-color:var(--pazapa-blue-dark);color:#FFFFFF;
  font-size:1.4rem;width:56px;height:56px;border-radius:50%;padding:0;
}
.card .speaker[disabled]{background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);border-color:#B9B9B9;}
.optional-tag{
  display:inline-block;background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);
  font-weight:700;border-radius:999px;padding:4px 16px;font-size:.95rem;
}
.centre{text-align:center;}
.record-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.record-row button{min-width:180px;}
.btn-record{background:var(--pazapa-blue);border-color:var(--pazapa-blue-dark);color:#FFFFFF;font-weight:700;}
.btn-record.is-recording{background:var(--pazapa-blue-dark);}
.status{margin-top:14px;text-align:center;font-size:1rem;min-height:1.5em;color:var(--pazapa-blue-dark);font-weight:600;}
.final{text-align:center;}
.final h2{color:var(--pazapa-blue-dark);font-size:2rem;}
.final .tick{
  display:inline-flex;align-items:center;justify-content:center;
  width:110px;height:110px;border-radius:50%;background:var(--pazapa-green);
  font-size:3rem;margin-bottom:10px;
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
@media (max-width:480px){
  .big-sound{width:150px;height:150px;font-size:2rem;}
  .step h2{font-size:1.4rem;}
  .character-art{height:200px;}
  .card .pic{height:120px;}
}
</style>
</head>

<!-- Single shared audio player for every official Pazapa recording. -->
<audio id="audioPlayer" preload="auto" playsinline webkit-playsinline></audio>

<script>
(function(){
  "use strict";

  /* ==================================================================
     BRITISH ENGLISH FEMALE VOICE
     One female en-GB voice is used for every spoken item on this page:
     the instructions, the target sound and the model words.
     If an official Pazapa recording is supplied below, that recording
     is played instead of the voice for that item.
  ================================================================== */

  var VOICE = null;

  var FEMALE_GB = ["libby","sonia","hazel","serena","kate","google uk english female",
                   "en-gb-standard-a","fiona","amy","emma","stephanie","female"];
  var MALE_HINTS = ["daniel","george","oliver","ryan","arthur","thomas","male"];

  function pickVoice(){
    if(!window.speechSynthesis) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    if(!vs.length) return null;
    var gb = vs.filter(function(v){ return /^en[-_]GB/i.test(v.lang); });
    var pool = gb.length ? gb : vs.filter(function(v){ return /^en/i.test(v.lang); });
    for(var i=0;i<FEMALE_GB.length;i++){
      for(var j=0;j<pool.length;j++){
        if(pool[j].name.toLowerCase().indexOf(FEMALE_GB[i]) !== -1) return pool[j];
      }
    }
    for(var k=0;k<pool.length;k++){
      var n = pool[k].name.toLowerCase(), male = false;
      for(var m=0;m<MALE_HINTS.length;m++){ if(n.indexOf(MALE_HINTS[m]) !== -1) male = true; }
      if(!male) return pool[k];
    }
    return pool[0] || null;
  }

  function loadVoice(){ VOICE = pickVoice(); }
  loadVoice();
  if(window.speechSynthesis && typeof window.speechSynthesis.onvoiceschanged !== "undefined"){
    window.speechSynthesis.onvoiceschanged = loadVoice;
  }

  /* ------------------------------------------------------------------
     ONE SOUND AT A TIME — no autoplay, nothing overlaps
  ------------------------------------------------------------------ */
  var player = document.getElementById("audioPlayer");

  /* ------------------------------------------------------------------
     MOBILE AUDIO UNLOCK  (iOS Safari, iPadOS, Android Chrome)
     Mobile browsers only allow an <audio> element to play if its very
     first play() happened inside a real user gesture. The activity is
     unlocked on the learner's first touch, tap or key press, so every
     later button works on phone, tablet and computer alike.
  ------------------------------------------------------------------ */
  var SILENT_MP3 = "data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA" +
                   "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgP////////////////////////////" +
                   "//////////////////8AAAA5TEFNRTMuMTAwAc0AAAAAAAAAABSAJAJAQgAAgAAAAnGMU2n/AAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
                   "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";

  var audioUnlocked = false;

  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    try{
      player.setAttribute("src", SILENT_MP3);
      player.load();
      var p = player.play();
      if(p && p.then){
        p.then(function(){
          player.pause();
          try{ player.currentTime = 0; }catch(e){}
        }).catch(function(){});
      }
    }catch(e){}
    // Prime the speech engine too — iOS needs a first utterance in a gesture.
    if(window.speechSynthesis && window.SpeechSynthesisUtterance){
      try{
        var u = new SpeechSynthesisUtterance(" ");
        u.volume = 0;
        u.lang = "en-GB";
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
  }

  ["pointerdown","touchstart","mousedown","keydown"].forEach(function(evt){
    document.addEventListener(evt, unlockAudio, { once:true, passive:true, capture:true });
  });

  function stopAllSound(){
    try{ player.pause(); player.currentTime = 0; }catch(e){}
    if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }

  /* Play one file through the single shared player.
     Stops anything already playing, rewinds to the start, then plays.
     Never autoplays. A playback problem is logged, never thrown. */
  function playFile(src){
    if(!src) return;
    unlockAudio();
    stopAllSound();
    // Always reset the source: iOS keeps a stale buffer otherwise.
    if(player.getAttribute("src") !== src){
      player.setAttribute("src", src);
      try{ player.load(); }catch(e){}
    }
    try{ player.currentTime = 0; }catch(e){}
    var p = player.play();
    if(p && p.catch){
      p.catch(function(err){
        // Some mobile browsers reject the first attempt while the element
        // is still loading. One retry once the file is ready.
        if(err && err.name === "AbortError"){ return; }
        player.addEventListener("canplaythrough", function once(){
          player.removeEventListener("canplaythrough", once);
          var r = player.play();
          if(r && r.catch){ r.catch(function(e2){ console.warn("Could not play audio: " + src, e2); }); }
        });
      });
    }
  }

  // rate 0.85 for instructions, 0.7 for the sound and the model words
  function speak(text, rate){
    stopAllSound();
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    if(!VOICE) loadVoice();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    if(VOICE) u.voice = VOICE;
    u.rate = rate || 0.85;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }

  ];

  /* Official instruction recordings, by step.
     Steps with no official recording keep the British female interface
     voice, which is used for interface wording only. */
  var STEP_AUDIO = {
    step1: AUDIO_FILES.instruction_1,
    step4: AUDIO_FILES.instruction_4
  };

  /* ------------------------------------------------------------------
     INSTRUCTION VOICE BUTTONS
  ------------------------------------------------------------------ */
  /* An official recording always takes priority. The British female
     voice is used only for interface wording that has no recording. */
  function sayStep(sec){
    if(!sec) return;
    var src = STEP_AUDIO[sec.id];
    if(src){ playFile(src); }
    else { speak(sec.getAttribute("data-say"), 0.85); }
  }

  Array.prototype.forEach.call(document.querySelectorAll(".js-say"), function(btn){
    btn.addEventListener("click", function(){ sayStep(btn.closest("section.step")); });
  });

  /* ------------------------------------------------------------------
     SEQUENTIAL FLOW — ONE SCREEN AT A TIME, NO AUTO-ADVANCE
  ------------------------------------------------------------------ */
  var STEPS = ["step1","step2","step3","step4","step5"];
  var doneBtn = document.getElementById("doneBtn");

  doneBtn.disabled = true;

  function showStep(id){
    stopAllSound();
    STEPS.forEach(function(sid){
      document.getElementById(sid).classList.toggle("is-visible", sid === id);
    });
    var target = document.getElementById(id);
    target.focus();
    if(id === "step5"){ showFinalStep(); }
    // the learner pressed Carry on, so the spoken instruction is not autoplay
    // Called straight from the Carry on click, never on a timer, so mobile
    // browsers still count it as a user gesture and allow playback.
    sayStep(target);
  }

  function showFinalStep(){
    // final completion section is visible — Done becomes available.
    // If completion was already sent, Done stays closed and says so.
    doneBtn.disabled = completionSent;
    if(completionSent){ document.getElementById("doneStatus").textContent = "Saved."; }
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-next]"), function(btn){
    btn.addEventListener("click", function(){ showStep(btn.getAttribute("data-next")); });
  });

  /* ------------------------------------------------------------------
     STEP 2 — ISOLATED /s/
  ------------------------------------------------------------------ */
  var soundBtn     = document.getElementById("soundBtn");
  var playAgainBtn = document.getElementById("playAgainBtn");

  // Official /s/ recording only — never text-to-speech for the phoneme.
  function playSoundS(){ playFile(AUDIO_FILES.sound_s); }

  soundBtn.disabled     = !AUDIO_FILES.sound_s;
  playAgainBtn.disabled = !AUDIO_FILES.sound_s;
  soundBtn.addEventListener("click", playSoundS);
  playAgainBtn.addEventListener("click", playSoundS);   // replay: same file, rewound

  /* ------------------------------------------------------------------
     STEP 3 — SOURCE EXAMPLE WORDS (no distractor, no choice)
  ------------------------------------------------------------------ */
  var wordCards = document.getElementById("wordCards");

  WORDS.forEach(function(item){
    var card = document.createElement("div");
    card.className = "card";

    var pic = document.createElement("div");
    pic.className = "pic";
    var img = document.createElement("img");
    img.src = item.image;
    img.alt = item.word;
    pic.appendChild(img);
    card.appendChild(pic);

    var label = document.createElement("div");
    label.className = "word";
    label.textContent = item.word;
    card.appendChild(label);

    var speaker = document.createElement("button");
    speaker.type = "button";
    speaker.className = "speaker";
    speaker.innerHTML = "🔊";
    speaker.setAttribute("aria-label", "Listen to " + item.word);
    // Official model recording only — never text-to-speech for a model word.
    speaker.disabled = !item.audio;
    speaker.addEventListener("click", function(){ playFile(item.audio); });
    card.appendChild(speaker);

    wordCards.appendChild(card);
  });

  /* ------------------------------------------------------------------
     STEP 4 — OPTIONAL VOICE RECORDING
     MediaRecorder only. Local only. No upload. No recognition. No scoring.
  ------------------------------------------------------------------ */
  var recordBtn  = document.getElementById("recordBtn");
  var playRecBtn = document.getElementById("playRecBtn");
  var recStatus  = document.getElementById("recStatus");

  var mediaRecorder = null, chunks = [], recordingUrl = null, isRecording = false;

  function resetRecordButton(){
    isRecording = false;
    recordBtn.textContent = "🎤 Record my voice";
    recordBtn.classList.remove("is-recording");
  }

  function supportsRecording(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  if(!supportsRecording()){
    recordBtn.disabled = true;
    recStatus.textContent = "Recording is not available on this device.";
  }else{
    recordBtn.addEventListener("click", function(){
      if(isRecording){ try{ mediaRecorder.stop(); }catch(e){} return; }
      stopAllSound();
      recStatus.textContent = "";
      // Microphone permission is requested only after the learner presses Record.
      navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.addEventListener("dataavailable", function(e){
          if(e.data && e.data.size > 0){ chunks.push(e.data); }
        });
        mediaRecorder.addEventListener("stop", function(){
          stream.getTracks().forEach(function(t){ t.stop(); });
          if(recordingUrl){ URL.revokeObjectURL(recordingUrl); }
          var blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
          recordingUrl = URL.createObjectURL(blob);   // local only, never uploaded
          playRecBtn.disabled = false;
          resetRecordButton();
          recStatus.textContent = "Your voice is saved on this device only.";
        });
        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = "⏹ Stop";
        recordBtn.classList.add("is-recording");
        recStatus.textContent = "Recording…";
      }).catch(function(){
        resetRecordButton();
        recStatus.textContent = "No microphone. You can carry on.";
      });
    });

    playRecBtn.addEventListener("click", function(){
      if(!recordingUrl) return;
      stopAllSound();
      player.onerror = null;
      player.setAttribute("src", recordingUrl);
      try{ player.load(); player.currentTime = 0; }catch(e){}
      var p = player.play();
      if(p && p.catch){ p.catch(function(err){ console.warn("Could not play the recording.", err); }); }
    });
  }

  /* ------------------------------------------------------------------
     MOODLE COMPLETION — one time only, on Done
  ------------------------------------------------------------------ */
  var completionSent = false;

  function activityCompleted(){
    if(completionSent) return;
    completionSent = true;
    console.log("W1L1 Let’s Discover the Sound completed");
  }

  /* ------------------------------------------------------------------
     REPEAT — the learner may go through the activity as often as they like.
     Completion is still only ever sent once.
  ------------------------------------------------------------------ */
  document.getElementById("againBtn").addEventListener("click", function(){
    document.getElementById("doneStatus").textContent = "";
    showStep("step1");
  });

  doneBtn.addEventListener("click", function(){
    if(doneBtn.disabled) return;
    stopAllSound();
    activityCompleted();
    doneBtn.disabled = true;
    document.getElementById("doneStatus").textContent = "Saved.";
    // Moodle manages course navigation — no automatic navigation from here.
  });

  /* ------------------------------------------------------------------
     INITIAL STATE
  ------------------------------------------------------------------ */
  STEPS.forEach(function(sid, i){
    document.getElementById(sid).classList.toggle("is-visible", i === 0);
  });
  doneBtn.disabled = true;

})();
</script>
